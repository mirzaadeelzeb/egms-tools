[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "egms-tools"
version = "0.1.0"
description = "Reading, analysing and decomposing European Ground Motion Service (EGMS) InSAR data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mirza Adeel Zeb" }]
keywords = ["insar", "egms", "ground-motion", "subsidence", "remote-sensing", "geospatial", "sentinel-1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "geopandas>=0.12",
    "shapely>=2.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
egms = "egmstools.cli:main"

[project.urls]
Homepage = "https://github.com/mirzaadeelzeb/egms-tools"
Issues = "https://github.com/mirzaadeelzeb/egms-tools/issues"

[tool.setuptools.packages.find]
include = ["egmstools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
